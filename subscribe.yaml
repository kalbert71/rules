# ref: https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
# ═══ 订阅模板（subconverter 转换用）═══
# 1. 规则已精简（性能优先）；OpenClash 下 mixed-port/dns.listen/tun 等会被插件覆写（UCI 优先）
# 2. 锚点规则（参考 HenryChiao/MIHOMO_YAMLS 锚点细谈）：
#    - 锚点必须先定义后引用；& 定义 * 引用，<<: 合并（当前块同名键优先）
#    - 锚点就近放置：p/use_p=机场订阅区  ut/pz/pz_d/mf/rj=出站策略区  ip/domain/class=规则集区
#    - 顶层自定义键（p/ut/pz 等）mihomo 忽略，仅用于存放锚点
# 3. 裸核用户请自行去掉下方控制面板模块的注释
# 机场订阅（为空的 url 由 subconverter 转换时填充，裸核直接运行会拉取失败）
p: &p {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300, expected-status: 204}}
# use_p=节点来源顺序（新增/删除机场时改此处 + 上方 url 两处即可，11 个分组自动生效）
# use 显式指定 provider 顺序（include-all 按下载完成顺序排列，顺序不稳定）
use_p: &use_p [ap1, ap2, ap3]
proxy-providers:
  ap1: { <<: *p, url: ""}
  ap2: { <<: *p, url: ""}
  ap3: { <<: *p, url: ""}


# 节点信息：无自定义节点；直连/拒绝直接使用内核内置的 DIRECT/REJECT（2026-08-07 方案 B）
# （内置名 DIRECT/REJECT/GLOBAL/PASS 为保留名，自定义 direct/reject 节点需改名，此处已无自定义节点）


# 全局配置
# OpenClash 下 mixed-port/log-level/dns.listen/tun 等会被插件覆写（UCI 优先），以下值为裸核默认
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
# 已移除 global-client-fingerprint（mihomo 新版已废弃该全局键，2026-08-07 审查；节点指纹由 subconverter 写在节点上）
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true


# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: ui
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"


# 嗅探：fake-ip 下域名已由 DNS 决定，但保留用于纯 IP/非标端口流量的域名识别；HTTP 端口已收窄避免误判噪音
# B1（2026-08-07）：HTTP [80, 8080-8880]→[80, 8080]（宽范围误判主源，4.5h 1万条噪音）
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443] # OpenClash B1 覆写为仅 [443]（2026-08-07）
  # 强制嗅探域名（流媒体类，避免纯 IP 连接后无法按域名分流）
  # 2026-08-09：移除 amazonaws（无 Amazon 规则后嗅探无收益；保留流媒体三域）
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.media.dssott.com"
  # 跳过嗅探域名（避免误识别与性能损耗）
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"


# 入站
tun:
  enable: true
  # system/gvisor/mixed；OpenClash 下被覆写为 system（UCI stack_type=system）
  stack: mixed
  # A2（2026-08-07）：MTU 1500（默认 9000→避免封装后分片开销）
  # ⚠️ 本行会被 OpenClash yml_change.sh 白名单重建剥离，持久生效依赖覆写脚本 openclash_custom_overwrite.sh 的 A2 块
  #mtu: 1500
  dns-hijack: ["any:53", "tcp://any:53"]
  # 使用 nikki 时开启接口指定（其余情况保持默认三 false）
  #device: nikki
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false


# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053 # OpenClash 下被覆写为 7874（UCI dns_port）
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


# ── 裸核 DNS 参考（linux.do 推荐 https://linux.do/t/topic/1061825）──
# 上方 dns: 段为当前生效配置（fake-ip + 国内 DoH，无需 fallback）。
# 裸核如需"国内/国外分流解析"，取消注释并替换上方 dns: 段后使用：
#   default-nameserver:  [tls://223.5.5.5, tls://223.6.6.6]                    # 必须为 IP（解析 DoH 域名用）
#   nameserver:          [https://cloudflare-dns.com/dns-query, https://dns.google/dns-query]  # MATCH 兜底域名用国外 DNS
#   proxy-server-nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]      # 解析代理节点 IP 用国内 DNS
#   direct-nameserver:   [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]          # 直连规则用国内 DNS
#   respect-rules: true  # 连接 DNS 服务器时遵循规则（国外 DNS 走代理连接）


# 出站策略：按需调整各组排序/成员（注意保留 emoji 与逗号）；国家组筛选不到节点时调整 filter 关键字
# 功能组成员列表保持显式可独立修改（各组选择互不影响）；公共参数已锚点化，改参数只改锚点一处：
#   use_p=节点来源顺序（定义在机场订阅区）  ut=url-test 公共参数（测速地址/间隔/容差）
#   pz=标准序列表  pz_d=DIRECT 优先列表  mf=手动切换 filter  rj=拒绝组
ut: &ut {type: url-test, use: *use_p, tolerance: 20, interval: 300, url: https://www.gstatic.com/generate_204}
pz: &pz [🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, 🇸🇬 狮城节点, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🌐 其他地区, ♻️ 自动选择, DIRECT]
pz_d: &pz_d [DIRECT, 🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, 🇸🇬 狮城节点, 🇭🇰 香港节点, 🇺🇲 美国节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🌐 其他地区, ♻️ 自动选择]
mf: &mf "^(?!(?:.*(?::|：|失联|过滤))).*$"
rj: &rj [REJECT, DIRECT]
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: *pz}
  # DIRECT 置于首位：mihomo 限制显式 proxies 恒在 use 节点前，无"追加末尾"机制；未手动选择时默认直连
  - {name: 🚀 手动切换, type: select, proxies: [DIRECT], use: *use_p, filter: *mf}
  - {name: 🚀 手动切换2, type: select, proxies: [DIRECT], use: *use_p, filter: *mf}
  - {name: 🚀 手动切换3, type: select, proxies: [DIRECT], use: *use_p, filter: *mf}
  - {name: 🐟 漏网之鱼, type: select, proxies: *pz}
  - {name: 📹 YouTube, type: select, proxies: *pz}
  - {name: 📲 Telegram, type: select, proxies: *pz}
  - {name: 💬 AI, type: select, proxies: [🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, 🌐 其他地区, DIRECT]}
  #- {name: 📖 Scholar, type: select, proxies: *pz_d}
  - {name: 📱 Twitter, type: select, proxies: *pz}
  - {name: 💬 SIMCardUK, type: select, use: *use_p, filter: "(?i)^(?=.*(?:GBR|GB|UK|Britain|British|England|英国|英格兰|苏格兰|Scotland|威尔士|Wales|北爱尔兰|英伦|伦敦|London))(?!(?:.*(?:港|日|韩|新加坡|美|台|新西兰|:|：))).*$"}
  - {name: 📺 巴哈姆特, type: select, proxies: [🇨🇳 台湾节点, 🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, DIRECT]}
  - {name: 🎥 NETFLIX, type: select, proxies: *pz}
  - {name: 📺 哔哩哔哩, type: select, proxies: [🎯 全球直连, 🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🌐 其他地区]}
  - {name: 🎶 Spotify, type: select, proxies: *pz}
  #- {name: 🎵 TikTok, type: select, proxies: *pz}
  - {name: Ⓜ️ 微软云盘, type: select, proxies: *pz_d}
  - {name: Ⓜ️ 微软服务, type: select, proxies: *pz_d}
  - {name: 📢 谷歌服务, type: select, proxies: *pz}
  - {name: 🍎 苹果服务, type: select, proxies: *pz_d}
  - {name: 🎮 游戏平台, type: select, proxies: *pz_d}
  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 手动切换, 🚀 手动切换2, 🚀 手动切换3, 🌐 其他地区]}
  - {name: 🌐 其他地区, type: select, use: *use_p, filter: "^(?!.*(?i)(港|HK|Hong Kong|HongKong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼)日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?<![a-zA-Z])US(?![a-zA-Z])|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓|:|：|失联|过滤)).*$"}
  - {name: 🇭🇰 香港节点, <<: *ut, filter: "(?i)^(?=.*(?:港|HK|Hong Kong|HongKong))(?!(?:.*(?:台|日|韩|新|美))).*$"}
  - {name: 🇸🇬 狮城节点, <<: *ut, filter: "(?i)^(?=.*(?:新加坡|坡|狮城|SG|Singapore))(?!(?:.*(?:港|台|日|韩|美))).*$"}
  - {name: 🇺🇲 美国节点, <<: *ut, filter: "(?i)^(?=.*(?:美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|United States|US|America))(?!(?:.*(?:港|台|日|韩|新|AUS|RUS))).*$"}
  - {name: 🇨🇳 台湾节点, <<: *ut, filter: "(?i)^(?=.*(?:台|新北|彰化|TW|taiwan))(?!(?:.*(?:港|日|韩|新|美))).*$"}
  - {name: 🇯🇵 日本节点, <<: *ut, filter: "(?i)^(?=.*(?:日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))(?!(?:.*(?:尼日利亚|港|台|韩|新|美))).*$"}
  - {name: 🇰🇷 韩国节点, <<: *ut, filter: "(?i)^(?=.*(?:KR|Korea|KOR|首尔|韩|韓))(?!(?:.*(?:港|台|日|新|美))).*$"}
  - {name: ♻️ 自动选择, <<: *ut, filter: "^(?!.*(：|:)).*$"}
  #- {name: 🔯 故障转移, type: fallback, include-all: true, tolerance: 20, interval: 300}
  - {name: 🛑 广告拦截, type: select, proxies: *rj}
  - {name: 🍃 应用净化, type: select, proxies: *rj}


# 规则匹配
# 规则顺序原则：精确优先（私有→自定义→局域网→白名单→广告→AI→国内可达直连→各平台→GFW 兜底→地理兜底→国内兜底→MATCH）
rules:
  - RULE-SET,private_domain,DIRECT,no-resolve
  - RULE-SET,private_ip,DIRECT,no-resolve

  # 自定义强制走代理域名（按需增删）
  - DOMAIN-SUFFIX,qichiyu.com,🚀 节点选择
  - DOMAIN-SUFFIX,010210.xyz,🚀 节点选择

  - RULE-SET,LocalAreaNetwork,🎯 全球直连
  - RULE-SET,UnBan,🎯 全球直连

  - RULE-SET,BanAD,🛑 广告拦截
  - RULE-SET,BanProgramAD,🍃 应用净化

  #- RULE-SET,OpenAi,💬 AI
  #- RULE-SET,Claude,💬 AI
  - RULE-SET,ai,💬 AI

  - RULE-SET,GoogleCN,🎯 全球直连
  - RULE-SET,SteamCN,🎯 全球直连

  - RULE-SET,google_domain,📢 谷歌服务
  - RULE-SET,google_ip,📢 谷歌服务

  - RULE-SET,scholar,🚀 节点选择

  - RULE-SET,spotify,🎶 Spotify

  #- RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,twitter,📱 Twitter

  - RULE-SET,microsoft@cn,🎯 全球直连
  - RULE-SET,onedrive,Ⓜ️ 微软云盘
  - RULE-SET,Microsoft,Ⓜ️ 微软服务
  - RULE-SET,Bing,Ⓜ️ 微软服务

  - RULE-SET,apple@cn,🎯 全球直连
  - RULE-SET,apple_domain,🍎 苹果服务
  - RULE-SET,apple_ip,🍎 苹果服务

  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,telegram_ip,📲 Telegram

  - RULE-SET,SIMCardUK,💬 SIMCardUK

  - RULE-SET,category-games@cn,🎯 全球直连
  - RULE-SET,Epic,🎮 游戏平台
  - RULE-SET,Origin,🎮 游戏平台
  - RULE-SET,Sony,🎮 游戏平台
  - RULE-SET,Steam,🎮 游戏平台
  - RULE-SET,Nintendo,🎮 游戏平台

  - RULE-SET,YouTube,📹 YouTube

  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,netflix_ip,🎥 NETFLIX

  - RULE-SET,Bahamut,📺 巴哈姆特
  - RULE-SET,biliintl,📺 哔哩哔哩
  - RULE-SET,Bilibili,📺 哔哩哔哩

  - RULE-SET,ProxyGFWlist,🚀 节点选择
  - RULE-SET,kindle,🚀 节点选择
  - RULE-SET,Download,🎯 全球直连

  - RULE-SET,geolocation-!cn,🚀 节点选择,no-resolve

  - RULE-SET,tld-cn,DIRECT,no-resolve
  - RULE-SET,cn_domain,DIRECT,no-resolve
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - MATCH,🐟 漏网之鱼


# 规则集
## type：可选http/file/inline  behavior：可选domain/ipcidr/classical format：可选yaml/text/mrs
## 规则集锚点存放键（x-anchor）：x- 前缀为 YAML 扩展键惯例（非 mihomo 配置项，会被忽略）
## 全链路已验证（2026-08-07）：mihomo -t ✓ + subconverter 转换实测 ✓；顶部另有 p/use_p/ut/pz 等锚点（见文件头说明）
x-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  fakeipfilter_domain: { <<: *domain, url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"}
  private_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  private_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"}

  # 广告
  LocalAreaNetwork: { <<: *class, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"}
  UnBan: { <<: *class, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list"}
  BanAD: { <<: *class, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"}
  BanProgramAD: { <<: *class, url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list"}

  google_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"}
  google_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"}

